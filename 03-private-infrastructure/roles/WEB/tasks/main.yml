---
# tasks 
- name: 1) 패키지 설치 - httpd 
  ansible.builtin.dnf:
    name: "{{ web_pkgs }}"
    state: present

- name: 2) 서비스 설정 - {{ web_src_file }} -> {{ web_dst_file }}
  ansible.builtin.copy:
    src: "{{ web_src_file }}"
    dest: "{{ web_dst_file }}"
    owner: root
    group: root
    mode: '0644'

- name: 3) 서비스 기동 - httpd, firewalld  
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ web_svcs }}"

- name: 4) 방화벽 설정 - http, https 
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ web_fw }}"